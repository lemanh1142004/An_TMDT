services:
  postgres:
    image: postgres:16-alpine
    container_name: fashion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashion_store_db}
      POSTGRES_USER: ${POSTGRES_USER:-fashion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_secret_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashion_user} -d ${POSTGRES_DB:-fashion_store_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fashion_network

  redis:
    image: redis:7-alpine
    container_name: fashion_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fashion_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashion_backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-fashion_store_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-fashion_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-fashion_secret_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fashion_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fashion_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - fashion_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fashion_network:
    driver: bridge
